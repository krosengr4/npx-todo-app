<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ToDo List</title>
    </head>
    <body>
        <header class="title">
            <h1 class="titleHeader">ToDo List! 📋</h1>
        </header>

        <main class="todoList">
            <article class="todoCard" data-priority="C">
                <input type="checkbox" class="todoCheck" id="todo-1" checked />

                <details class="todoBody">
                    <summary class="todoSummary">
                        <span class="todoTitle">Take out the trash.</span>

                        <div class="todoMeta">
                            <p class="todoDue">
                                <span class="metaLabel">Due Date:</span>
                                Thursday, 10-27-26
                            </p>
                            <p class="todoPriority">
                                <span class="metaLabel">Priority</span>: C
                            </p>
                        </div>

                        <span class="todoArrow" aria-hidden="true">▸</span>
                    </summary>

                    <p class="todoDescription">
                        Roll the bin to the curb before 7am. Recycling goes out
                        the same night.
                    </p>
                </details>
            </article>

            <article class="todoCard" data-priority="A">
                <input type="checkbox" class="todoCheck" id="todo-2" />

                <details class="todoBody">
                    <summary class="todoSummary">
                        <span class="todoTitle">Study for calculus exam</span>

                        <div class="todoMeta">
                            <p class="todoDue">
                                <span class="metaLabel">Due Date:</span>
                                Tuesday, 11-5-26
                            </p>
                            <p class="todoPriority">
                                <span class="metaLabel">Priority</span>: A
                            </p>
                        </div>

                        <span class="todoArrow" aria-hidden="true">▸</span>
                    </summary>

                    <p class="todoDescription">
                        The test is over derivatives. Study chapter 13!
                    </p>
                </details>
            </article>
        </main>
    </body>
</html>
